# Registro das lutas do loop de triagem.
#
# Regra numero um, decidida antes de escalar para 10 lutas: o held-out e por
# LUTA, nao por frame nem por shot. As lutas em `role: heldout` nunca entram
# em masks.bin nem em nenhum treino do student -- elas existem para responder
# a unica pergunta que importa: "o student generaliza para uma luta que nunca
# viu?". Travar isso AQUI, antes de processar qualquer frame novo, evita a
# tentacao de usar tudo como treino quando os numeros apertarem.
#
# status: fetched -> scouted -> triaged -> labeled -> in-dataset
# role:   train | heldout | fora-de-escopo | TBD  (TBD so e aceitavel antes do
#                                 primeiro treino multi-luta; na hora de treinar, decide)
#
# `fora-de-escopo` (2026-09-01): a luta nao entra em treino NEM em held-out,
# porque o produto nao promete resolve-la. So entra aqui com o numero que
# justifica a saida -- escopo definido por medicao, nunca por incomodo com o
# resultado. O limiar medido e a altura do atleta no quadro: abaixo de ~40% da
# altura do quadro, os dois corpos sao achados em 18% dos quadros; entre 40% e
# 60%, em 52% (n=116 vereditos de juiz, `scripts/scale_scope.py cross`).
# A causa e a escala mesmo, nao "footage dificil": recortar 2.5x em volta do
# par e rodar o MESMO v4 melhora o recall no par em 33 de 47 quadros wide e
# piora em 0 (`scale_scope.py quant`). Ou seja, sai do held-out mas nao sai do
# roadmap: volta quando existir zoom digital com ROI honesta.

