# BjjVision — pipeline configuration
# Every threshold here is a knob the LLM supervisor is allowed to tune between passes.

video:
  target_fps: 30            # resample; SAM2 memory assumes temporal continuity
  max_width: 1280           # downscale for compute; masks upscaled at render
  chunk_frames: 240         # SAM2 propagation window cap (~8s @30fps)

# --- Broadcast structure ------------------------------------------------
# This footage is CUT footage, not a locked-off camera. SAM2's memory assumes
# temporal continuity, so a propagation window must never straddle a cut.
shots:
  z_threshold: 150          # MAD-normalised dissimilarity. Calibrated on both
                            # matches: real cuts land at z=270-2900, while camera
                            # and athlete motion tops out around z=40. Sampling
                            # 6 kept cuts and 6 rejected ones confirmed no false
                            # negatives and no false positives at this value.
                            # z=10 mistook every pan for a cut (381 in 840s).
  min_shot_frames: 10       # dissolves trip several frames; keep only the start
  flat_max: 0.55            # frame fraction with no local texture -> graphics plate
  track_kinds: [match, mat] # shot kinds worth spending GPU on

detect:
  model: yolo11x-pose.pt    # pose gives keypoints: crucial for grappling geometry
  conf: 0.25
  iou: 0.60
  min_box_area_frac: 0.004  # anything smaller is crowd/background
  max_persons: 12

segment:
  sam2_cfg: configs/sam2.1/sam2.1_hiera_l.yaml
  sam2_ckpt: checkpoints/sam2.1_hiera_large.pt
  offload_video_to_cpu: true
  offload_state_to_cpu: false
  prompt_points_per_obj: 6  # sampled from color-consistent pixels, not box centers
  # Seed each window on a chosen object scale instead of on re-derived points.
  # SAM2 answers a ONE-point prompt with three scales (part / garment / person);
  # any prompt carrying more labels -- our 6 points + 6 mutual negatives, or a
  # box, which is encoded as 2 -- suppresses that answer and takes whatever
  # single mask comes back. Measured over 84 window seeds of galvao-xande:
  # median mask area A 0.0504 -> 0.0811, B 0.0495 -> 0.0932, and the two masks'
  # cross-IoU stayed at 0.0000, so the recovered pixels are the athlete's own
  # legs and head rather than the opponent bleeding in.
  scale_select:
    enabled: true
    max_contam: 0.25        # reject a scale once this much of it votes opponent
    min_px: 1500            # below this a candidate is a fold, not a body part

# --- Identity: colour is the anchor -------------------------------------
appearance:
  color_space: lab          # CIELAB: white-vs-blue/black gi separates hard on b* and L*
  hist_bins: [8, 12, 12]    # L, a, b
  torso_only: true          # sample the gi, not skin/hair/mat
  # Vertical slice of the mask bbox the prototype is built from. This was
  # [0.15, 0.60] -- which is, precisely, the jacket. That made "the colour of
  # athlete B" mean "the colour of B's jacket", so the prototype never learned
  # his white trousers, and `purity` scored a jacket-only mask 0.997 while the
  # athlete's legs were missing. Widening it costs almost nothing in the thing
  # the narrow band was protecting, and buys back the headroom that completeness
  # spends. Measured over 140 frames:
  #   band          separability   B purity min   (purity_min gate is 0.62)
  #   [0.15, 0.60]     0.847          0.761
  #   [0.05, 0.90]     0.824          0.876
  torso_band: [0.05, 0.90]
  min_mask_pixels: 400
  prototype_bank: 24        # rolling high-confidence exemplars per fighter
  prototype_update_conf: 0.80  # only pure, confident frames enter the bank (anti-drift)

reid:
  embed_model: osnet_x1_0   # deep appearance, computed on MASKED crops (bg zeroed)
  weight_color: 0.65        # colour dominates: it is a physical invariant of the match
  weight_embed: 0.25
  weight_motion: 0.10

# --- Role assignment: who is actually fighting ---------------------------
roles:
  mat_estimate_frames: 90        # frames sampled to learn the mat colour/polygon
  referee_color_margin: 0.35     # dist-to-both-prototypes above this => not a fighter
  contact_window_s: 3.0          # pair with max sustained contact = the two athletes
  contact_iou_min: 0.02
  crowd_y_reject_frac: 0.35      # persons whose feet sit above this line are stands
  require_inside_mat: true

# --- Recalibration: the self-healing loop --------------------------------
recalibrate:
  purity_min: 0.62          # fraction of mask pixels agreeing with its own prototype
  proto_margin_min: 0.15    # mask must sit this much closer to its own prototype
                            # than to the opponent's. A margin, not an absolute
                            # distance: arena lighting swings a white gi across
                            # L 145-190, which destroys histogram overlap while
                            # identity stays obvious. Absolute distance fired on
                            # 100% of real frames for the light gi at purity 0.98.
  proto_dist_max: 0.95      # loose sanity bound only; catches colour collapse
  mask_iou_max: 0.15        # two fighter masks overlapping more than this = bleed
  area_jump_max: 2.2        # frame-to-frame mask area ratio
  sam2_score_min: 0.55
  cooldown_frames: 8
  max_consecutive: 5        # after N failed re-anchors, escalate to LLM supervisor

# --- LLM supervisor: the PhD in the loop ---------------------------------
llm:
  enabled: true
  model: claude-opus-5
  adjudicate_every_s: 10.0  # routine check-in even when healthy
  escalate_on_recal: true   # every hard recalibration goes to the VLM
  contact_sheet_cols: 3
  max_calls_per_minute: 12
  narrate: true             # position / event commentary for the on-screen report
  tune_between_passes: true # supervisor may rewrite thresholds for the next pass

render:
  hud: true
  mask_alpha: 0.45
  timeline: true
  show_health: true         # purity, proto-dist, recal events — the diagnostics panel
  clean: false              # true = source frame at full size, masks only: no side
                            # panel, no timeline, no A/B badges. A viewing mode, not
                            # a diagnostic one. `bjj render --clean` sets it per call
                            # without re-running anything, which is the point of
                            # keeping masks.bin.
  out_crf: 18
